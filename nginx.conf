server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Serve the published aptly repository.
    # aptly publishes to <rootDir>/public (see aptly.conf rootDir=/data/aptly).
    location / {
        root /data/aptly/public;
        autoindex on;
        index index.html index.htm;
    }

    # Serve ONLY the GPG public key for client signature verification.
    # /data/gpg also holds the private signing key, which must never be exposed.
    location = /gpg/public.key {
        alias /data/gpg/public.key;
        default_type text/plain;
    }

    location /gpg/ {
        deny all;
    }

    # Lightweight health endpoint for monitoring / orchestration.
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
