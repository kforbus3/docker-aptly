server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Serve the published aptly repository.
    # aptly publishes to <rootDir>/public (see aptly.conf rootDir=/data/aptly).
    location / {
        root /data/aptly/public;
        autoindex on;
        index index.html index.htm;
    }

    # Serve the GPG public key so clients can import it for signature verification.
    location /gpg/ {
        alias /data/gpg/;
        autoindex on;
    }

    # Lightweight health endpoint for monitoring / orchestration.
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
