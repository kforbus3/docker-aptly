services:
  aptly-repo:
    build: .
    image: docker-aptly
    container_name: aptly-repo-server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # All persistent state lives under /data. To use your own signing key,
      # place it at ./data/gpg/private.key (host) before first start.
      - ./data:/data
    environment:
      - TZ=UTC
      - GPG_NAME_REAL=Aptly Repository
      - GPG_NAME_EMAIL=repo@yourdomain.com
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
